version: '3.8'

services:
  localstack:
    image: localstack/localstack:2.1
    container_name: dms-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,dynamodb
      - DEBUG=0
      - DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=mock-key
      - AWS_SECRET_ACCESS_KEY=mock-secret
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./localstack-init:/etc/localstack/init/ready.d"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: dms-app
    ports:
      - "8081:8080"
    environment:
      TZ: America/La_Paz
      APP_TIMEZONE: America/La_Paz
      SPRING_PROFILES_ACTIVE: dev
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_PUBLIC_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY: mock-key
      AWS_SECRET_KEY: mock-secret
      AWS_BUCKET_NAME: lostres-dms-bucket
      DYNAMODB_DOCUMENTS_TABLE: dms-documents
      DYNAMODB_AUDIT_TABLE: dms-audit-logs
      SECURITY_ENABLED: "false"
      REQUIRE_USER_ID: "true"
    depends_on:
      localstack:
        condition: service_healthy

volumes: {}
